<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#08111f">
    <meta name="description" content="ARRIVA live train status">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <title>ARRIVA mobile</title>
  </head>
  <body>
    <main class="shell">
      <header><div><p class="eyebrow">ARRIVA / LIVE NETWORK</p><h1>Train status</h1></div><span id="connection" class="pill offline">Offline</span></header>
      <label class="search"><span>⌕</span><input id="search" type="search" placeholder="Search train, route or station" autocomplete="off"></label>
      <section id="trains" class="train-list" aria-live="polite"></section>
      <section id="details" class="details empty"><p>Select a train to see live ETA and delay details.</p></section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
